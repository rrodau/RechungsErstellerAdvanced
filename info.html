<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stammdaten – Rechnungsersteller</title>
    <script src="./info_script.js"></script>
    <link rel="stylesheet" type="text/css" href="./style.css">
</head>
<body>
    <div class="page">

      <header class="app-header">
        <div>
          <p class="eyebrow">Stammdaten</p>
          <h1>Absender &amp; Empfänger</h1>
        </div>
        <a href="./index.html">
          <button class="btn btn-ghost">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Zurück
          </button>
        </a>
      </header>

      <section class="sheet">
        <div class="form-container">

          <div class="form-group">
              <p class="sheet-label">Absender</p>

              <label for="firmName">Firmenname</label>
              <input type="text" id="firmName">

              <label for="senderFirstName">Vorname</label>
              <input type="text" id="senderFirstName">

              <label for="senderSurName">Name</label>
              <input type="text" id="senderSurName">

              <label for="senderAddress">Adresse</label>
              <input type="text" id="senderAddress">

              <label for="senderPlz">Postleitzahl</label>
              <input type="text" id="senderPlz">

              <label for="senderCity">Stadt</label>
              <input type="text" id="senderCity">

              <label for="phone">Telefon</label>
              <input type="text" id="phone">

              <label for="strNr">Steuernummer</label>
              <input type="text" id="strNr">

              <label for="mwstNr">Mwst.-Iden-Nr.</label>
              <input type="text" id="mwstNr">

              <label for="bankName">Bank</label>
              <input type="text" id="bankName">

              <label for="iban">IBAN</label>
              <input type="text" id="iban">

              <label for="bic">BIC</label>
              <input type="text" id="bic">

          </div>

          <div class="form-group">
              <p class="sheet-label">Empfänger</p>

              <label for="recieverName">Name</label>
              <input type="text" id="recieverName">

              <label for="recieverCity">Stadt</label>
              <input type="text" id="recieverCity">

              <label for="recieverAddress">Adresse</label>
              <input type="text" id="recieverAddress">
          </div>
        </div>

        <div class="sheet-divider"></div>

        <div class="action-row action-row--end">
            <button class="btn btn-primary" onclick="saveDetails()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
              Speichern
            </button>
        </div>
      </section>
    </div>
</body>
</html>
