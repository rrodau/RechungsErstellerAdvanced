<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechnungsersteller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="./style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.3.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.14/jspdf.plugin.autotable.min.js"></script>

    <script src="./script.js"></script>

</head>
<body>
    <div class="page">

      <header class="app-header">
        <div class="heading">
          <span class="logo-badge">R</span>
          <div>
            <h1 id="title">Rechnungsersteller</h1>
            <p class="subtitle">Positionen erfassen und als PDF exportieren</p>
          </div>
        </div>
        <a id="info-btn" href="./info.html">
          <button class="button">Details bearbeiten</button>
        </a>
      </header>

      <section class="card">
        <p class="section-title">Positionen</p>
        <div class="table-wrapper">
          <table id="table">
              <tr>
                  <th>Pos</th>
                  <th>Beschreibung</th>
                  <th>Betrag</th>
                  <th class="no-border"></th>
              </tr>
          </table>
        </div>
      </section>

      <section class="card">
        <p class="section-title">Neue Position hinzufügen</p>
        <div class="inputs">
          <div class="field description-field">
            <label for="description">Beschreibung</label>
            <textarea class="custom-textarea" id="description" oninput="anpassenFeld()" placeholder="Beschreibung"></textarea>
          </div>
          <div class="field">
            <label for="amount">Betrag (brutto)</label>
            <input type="number" id="amount" placeholder="Betrag">
          </div>
          <button class="button add-row-button" onclick="addNewRow()">Hinzufügen</button>
        </div>
      </section>

      <section class="card">
        <p class="section-title">Rechnungsdetails</p>
        <div class="inputs flex">
          <div class="field">
            <label for="invoiceNr">Rechnungsnummer</label>
            <input id="invoiceNr" type="number" placeholder="Rechnungsnummer">
          </div>
          <div class="field">
            <label for="startDate">Von</label>
            <input class="date" type="text" id="startDate" placeholder="TT-MM-JJJJ" pattern="\d{2}-\d{2}-\d{4}">
          </div>
          <span class="date-separator">–</span>
          <div class="field">
            <label for="endDate">Bis</label>
            <input class="date" type="text" id="endDate" placeholder="TT-MM-JJJJ" pattern="\d{2}-\d{2}-\d{4}">
          </div>
          <div class="field">
            <label for="createDate">Erstellt am</label>
            <input class="date" type="text" id="createDate" placeholder="TT-MM-JJJJ" pattern="\d{2}-\d{2}-\d{4}">
          </div>
        </div>
      </section>

      <div class="center">
        <div class="button-row">
          <div class="button-div">
            <button class="button" id="downloadButton" onclick="download()" disabled>Download</button>
          </div>

          <div class="button-div">
            <button class="button" id="deleteAllButton" toggle="modal" data-targe="#myModal"> Alles Löschen</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Modal-Container -->
    <div id="meinModal" class="modal">
      <!-- Modal-Inhalt -->
      <div class="modal-content">
          <span class="close-button" onclick="schließeModal();">&times;</span>
          <p>Sicher das Sie alle Einträge löschen wollen?</p>
          <div class="button-row">
            <button onclick="schließeModal();">Schließen</button>
            <button class="button" onclick="deleteAll();">Löschen</button>
          </div>
      </div>
    </div>
    <script>
      window.onload = function() {
          document.getElementById('downloadButton').disabled = false;
      };

      document.getElementById("deleteAllButton").onclick = function() {
        document.getElementById("meinModal").style.display = "block";
      };
    </script>

</body>
</html>
