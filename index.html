<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>Rechnungsersteller</title>
    <script src="./frame-guard.js"></script>
    <script src="./theme.js"></script>
    <link rel="stylesheet" type="text/css" href="./style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.3.1/jspdf.umd.min.js" integrity="sha384-15uoZT5zN6lseew0GeeAygJQoFCwK/ZzDGIsQag3BmLoWPik5wQ/+BW9YduMQhEX" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.14/jspdf.plugin.autotable.min.js" integrity="sha384-LA77jsRqvOTFlz2lAtPq06dFEpSb9gAL82l5y8pwW8UmT5NUrC71xwNdif+NI8VM" crossorigin="anonymous"></script>

    <script src="./script.js"></script>

</head>
<body>
    <p class="frame-warning">Diese Seite darf nicht in einem fremden Fenster eingebettet werden.</p>
    <div class="page">

      <header class="app-header">
        <div>
          <p class="eyebrow">Rechnung erstellen</p>
          <h1 id="title">Rechnungsersteller</h1>
        </div>
        <div class="header-actions">
          <button class="theme-toggle" onclick="toggleTheme()" aria-label="Farbschema umschalten" title="Farbschema umschalten">
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <a id="info-btn" href="./info.html">
            <button class="btn btn-ghost">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              Details bearbeiten
            </button>
          </a>
        </div>
      </header>

      <section class="sheet">

        <p class="sheet-label">Positionen</p>
        <div class="table-wrapper">
          <table id="table">
              <tr>
                  <th>Pos</th>
                  <th>Beschreibung</th>
                  <th class="col-amount">Betrag</th>
                  <th class="no-border"></th>
              </tr>
              <tr class="input-row">
                  <td><span class="pos-badge pos-badge--ghost">+</span></td>
                  <td>
                    <textarea class="custom-textarea" id="description" oninput="anpassenFeld()" placeholder="Neue Position beschreiben …"></textarea>
                  </td>
                  <td class="col-amount">
                    <input type="number" id="amount" placeholder="0,00" onkeydown="if (event.key === 'Enter') { event.preventDefault(); addNewRow(); }">
                  </td>
                  <td class="no-border">
                    <button class="addButton no-border" onclick="addNewRow()" aria-label="Position hinzufügen" title="Position hinzufügen">
                      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                  </td>
              </tr>
          </table>
        </div>

        <div class="sheet-divider"></div>

        <p class="sheet-label">Rechnungsdetails</p>
        <div class="meta-row">
          <div class="meta-field">
            <label for="invoiceNr">Rechnungsnummer</label>
            <input id="invoiceNr" type="number" placeholder="0000">
          </div>
          <div class="meta-field">
            <label for="startDate">Von</label>
            <input class="date" type="text" id="startDate" placeholder="TT.MM.JJJJ" pattern="\d{2}\.\d{2}\.\d{4}">
          </div>
          <div class="meta-field">
            <label for="endDate">Bis</label>
            <input class="date" type="text" id="endDate" placeholder="TT.MM.JJJJ" pattern="\d{2}\.\d{2}\.\d{4}">
          </div>
          <div class="meta-field">
            <label for="createDate">Erstellt am</label>
            <input class="date" type="text" id="createDate" placeholder="TT.MM.JJJJ" pattern="\d{2}\.\d{2}\.\d{4}">
          </div>
        </div>

        <div class="sheet-divider"></div>

        <div class="action-row">
          <button class="btn btn-text btn-danger" id="deleteAllButton" toggle="modal" data-targe="#myModal">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
            Alles löschen
          </button>
          <button class="btn btn-primary" id="downloadButton" onclick="download()" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Als PDF herunterladen
          </button>
        </div>

      </section>

    </div>

    <!-- Modal-Container -->
    <div id="meinModal" class="modal">
      <!-- Modal-Inhalt -->
      <div class="modal-content">
          <span class="close-button" onclick="schließeModal();">&times;</span>
          <p>Sicher das Sie alle Einträge löschen wollen?</p>
          <div class="button-row">
            <button class="btn btn-secondary" onclick="schließeModal();">Schließen</button>
            <button class="btn btn-danger-solid" onclick="deleteAll();">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
              Löschen
            </button>
          </div>
      </div>
    </div>
    <script>
      window.onload = function() {
          document.getElementById('downloadButton').disabled = false;
      };

      document.getElementById("deleteAllButton").onclick = function() {
        document.getElementById("meinModal").style.display = "block";
      };
    </script>

</body>
</html>
